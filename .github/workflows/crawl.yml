name: MegaSearch Crawler

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycryptodome
      - run: python crawler.py
      - name: Index speichern
        run: |
          git config user.name "megasearch-bot"
          git config user.email "megasearch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Index aktualisiert"
          git push
